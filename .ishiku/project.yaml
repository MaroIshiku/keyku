{
  "schema_version": 1,
  "kit_version": "1.2.1",
  "application": {
    "id": "keyku",
    "name": "Keyku",
    "family": "ishiku",
    "type": "web_application"
  },
  "platform": {
    "profile": "flask-adapter",
    "authentication": "standard-account",
    "design_system": "ishiku-design-5",
    "security_baseline": "level-2",
    "locale": "en"
  },
  "quality": {
    "default_risk_class": "C"
  },
  "updates": {
    "timezone": "Europe/Berlin",
    "weekly_schedule": {
      "day": "monday",
      "time": "05:00"
    }
  },
  "repository": {
    "default_branch": "main",
    "container_registry": "ghcr.io"
  },
  "verification": {
    "commands": [
      {
        "name": "ishiku-compliance",
        "command": "node .ishiku/kit/scripts/compliance-test .",
        "required_for_verified": true
      },
      {
        "name": "application",
        "command": "python3 tests/run.py",
        "required_for_verified": true
      },
      {
        "name": "browser",
        "command": "node tests/run-browser.mjs",
        "required_for_verified": true
      },
      {
        "name": "compose",
        "command": "docker compose -f docker-compose.example.yml config --quiet",
        "required_for_verified": true
      },
      {
        "name": "container",
        "command": "docker build --load -t keyku:verify .",
        "required_for_verified": true
      },
      {
        "name": "container-migration",
        "command": "sh tests/test-container-migration.sh",
        "required_for_verified": true
      }
    ]
  },
  "upstreams": [
    {"id": "python-runtime", "source": "docker.io/library/python:3.14-alpine", "strategy": "container"},
    {"id": "flask", "source": "https://pypi.org/project/Flask/", "strategy": "dependency"},
    {"id": "gunicorn", "source": "https://pypi.org/project/gunicorn/", "strategy": "dependency"},
    {"id": "argon2-cffi", "source": "https://pypi.org/project/argon2-cffi/", "strategy": "dependency"},
    {"id": "playwright", "source": "https://www.npmjs.com/package/@playwright/test", "strategy": "dependency"},
    {"id": "axe-core", "source": "https://www.npmjs.com/package/axe-core", "strategy": "dependency"}
  ]
}
