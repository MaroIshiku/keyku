name: ishiku verify

on:
  workflow_call:
    inputs:
      require_all_verified:
        description: Fail unless every AppSpec requirement has executed verification evidence
        required: false
        type: boolean
        default: true
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ishiku-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install browser verification runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify independently cloned app
        env:
          REQUIRE_ALL_VERIFIED: ${{ github.event_name == 'workflow_call' && inputs.require_all_verified }}
        run: |
          if [ "$REQUIRE_ALL_VERIFIED" = "true" ]; then
            node .ishiku/kit/scripts/verify-app . --full
          else
            node .ishiku/kit/scripts/verify-app . --full --allow-unverified-requirements
          fi
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ishiku-verification-${{ github.run_id }}
          path: .ishiku/reports/
          if-no-files-found: error
          retention-days: 30
