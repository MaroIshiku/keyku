name: keyku
services:
  keyku-init:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    cap_drop:
      - ALL
    cpus: 0.25
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        find /data -xdev -exec chown -h 10001:10001 {} +
        find /data -xdev -type d -exec chmod 0750 {} +
        find /data -xdev -type f -exec chmod 0600 {} +
    image: ghcr.io/maroishiku/keyku:v0.3.1
    mem_limit: "33554432"
    network_mode: none
    pids_limit: 32
    privileged: false
    pull_policy: always
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    user: "0:0"
    volumes:
      - type: bind
        source: /DATA/AppData/keyku/data
        target: /data
        bind:
          create_host_path: true
          selinux: Z
  keyku:
    cap_drop:
      - ALL
    cpus: 0.5
    cpu_shares: 90
    command: []
    container_name: keyku
    depends_on:
      keyku-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "134217728"
          pids: 128
        reservations:
          devices: []
    environment:
      - ISHIKU_APP_URL=
      - ISHIKU_BASE_PATH=/
      - ISHIKU_COOKIE_SECURE=auto
      - ISHIKU_DATA_DIR=/data
      - ISHIKU_LOG_LEVEL=info
      - ISHIKU_SETUP_SECRET=
      - ISHIKU_TRUST_PROXY=false
      - PORT=3000
      - PUBLIC_DIR=/app/public
      - TZ=Europe/Berlin
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:3000/readyz',
          timeout=3).read()
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    hostname: keyku
    image: ghcr.io/maroishiku/keyku:v0.3.1
    init: true
    labels:
      icon: https://raw.githubusercontent.com/MaroIshiku/keyku/main/public/icons/icon-512.png
      org.opencontainers.image.description: Self-hosted Steam key vault with first-run admin setup and public share links.
      org.opencontainers.image.source: https://github.com/MaroIshiku/keyku
      org.opencontainers.image.title: Keyku - Key Vault
      org.opencontainers.image.url: https://github.com/MaroIshiku/keyku
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 5m
    mem_limit: "134217728"
    pids_limit: 128
    ports:
      - target: 3000
        published: "65005"
        protocol: tcp
    pull_policy: always
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    stop_signal: SIGTERM
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - type: bind
        source: /DATA/AppData/keyku/data
        target: /data
        bind:
          create_host_path: true
          selinux: Z
    user: "10001:10001"
    devices: []
    networks:
      - keyku
    privileged: false
networks:
  keyku:
    name: keyku
    driver: bridge
x-casaos:
  architectures:
    - amd64
    - arm64
  author: MaroIshiku
  category: Utilities
  description:
    de_de: Self-hosted Steam-Key-Tresor mit Admin-Setup, geschuetzten Konten und oeffentlichen Share-Links.
    en_us: Self-hosted Steam key vault with admin setup, protected accounts and public share links.
  developer: MaroIshiku
  hostname: ""
  icon: https://raw.githubusercontent.com/MaroIshiku/keyku/main/public/icons/icon-512.png
  index: /
  is_uncontrolled: false
  main: keyku
  port_map: "65005"
  scheme: http
  store_app_id: keyku
  tagline:
    de_de: Privater Steam-Key-Tresor fuer Familie und Freunde.
    en_us: Private Steam key vault for family and friends.
  thumbnail: https://raw.githubusercontent.com/MaroIshiku/keyku/main/public/icons/icon-512.png
  tips:
    before_install:
      de_de: >
        Pflicht: Setze ISHIKU_SETUP_SECRET vor dem Start auf einen langen
        zufaelligen Wert. Dieses Secret wird nur fuer die Erstellung des
        ersten Adminaccounts verwendet.


        Persistente Daten liegen auf dem ZimaOS-Host unter /DATA/AppData/keyku/data und werden im Container nach /data gemountet.


        Veroeffentliche die WebUI ueber HTTPS, wenn du die App ausserhalb deines lokalen Netzes bereitstellst.
      en_us: >
        Required: set ISHIKU_SETUP_SECRET to a long random value before
        starting. This secret is only used to create the first admin account.


        Persistent data is stored on the ZimaOS host at /DATA/AppData/keyku/data and mounted into the container at /data.


        Keyku automatically prepares ownership and restrictive permissions for fresh and legacy data directories before the non-root web service starts.


        Publish the WebUI through HTTPS when exposing the app outside your local network.
  title:
    custom: Keyku - Key Vault
    de_de: Keyku
    en_us: Keyku
