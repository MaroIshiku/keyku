name: keyku

services:
  keyku:
    image: ${KEYKU_IMAGE:-ghcr.io/maroishiku/keyku:v0.3.0}
    container_name: keyku
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    ports:
      - target: 3000
        published: "65005"
        protocol: tcp
    environment:
      TZ: "Europe/Berlin"
      ISHIKU_APP_URL: "https://keyku.example.local"
      ISHIKU_BASE_PATH: "/"
      ISHIKU_COOKIE_SECURE: "auto"
      ISHIKU_DATA_DIR: "/data"
      ISHIKU_LOG_LEVEL: "info"
      ISHIKU_TRUST_PROXY: "false"
      ISHIKU_SETUP_SECRET: ""
      PORT: "3000"
      PUBLIC_DIR: "/app/public"
      # Optional hardened alternative:
      # ISHIKU_SETUP_SECRET_FILE: "/run/secrets/ishiku_setup_secret"
    volumes:
      - type: bind
        source: /DATA/AppData/keyku/data
        target: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/readyz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
